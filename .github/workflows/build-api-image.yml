name: Build and publish API image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget update source github
          --username ${{ github.actor }}
          --password ${{ secrets.NUGET_GITHUB_PAT || secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Publish API host
        run: |
          dotnet publish src/FellowshipAnalyzer/FellowshipAnalyzer.Api.Web/FellowshipAnalyzer.Api.Web.csproj \
            -c Release \
            -o publish/api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fellowshipanalyzer-api:latest
            ghcr.io/${{ github.repository_owner }}/fellowshipanalyzer-api:${{ github.sha }}
