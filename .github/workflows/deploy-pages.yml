name: Deploy client to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: 'Absolute base URL of the API host (must end with /); empty keeps same-origin calls'
        required: false
        default: ''

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        run: >-
          dotnet nuget update source github
          --username ${{ github.actor }}
          --password ${{ secrets.NUGET_GITHUB_PAT || secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Resolve .NET SDK version
        id: dotnet
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-tools workload
        id: cache-wasm-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.dotnet/sdk-manifests
            ~/.dotnet/packs
            ~/.dotnet/metadata
            ~/.dotnet/library-packs
          key: dotnet-workload-wasm-tools-${{ runner.os }}-${{ steps.dotnet.outputs.version }}

      - name: Install wasm-tools workload
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Publish Blazor WebAssembly (standalone)
        run: |
          dotnet publish src/FellowshipAnalyzer/FellowshipAnalyzer/FellowshipAnalyzer.csproj \
            -c Release \
            -o publish/static

      - name: Prepare Pages artifact
        run: |
          sed -i 's|<base href="/" />|<base href="/FellowshipAnalyzer/" />|' publish/static/wwwroot/index.html
          cp publish/static/wwwroot/index.html publish/static/wwwroot/404.html
          touch publish/static/wwwroot/.nojekyll

          API_BASE_URL="${{ inputs.apiBaseUrl || vars.API_BASE_URL }}"
          if [ -n "$API_BASE_URL" ]; then
            case "$API_BASE_URL" in */) ;; *) API_BASE_URL="$API_BASE_URL/" ;; esac
            jq --arg url "$API_BASE_URL" '.Api.BaseUrl = $url' publish/static/wwwroot/appsettings.json > appsettings.tmp.json
            mv appsettings.tmp.json publish/static/wwwroot/appsettings.json
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/static/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
